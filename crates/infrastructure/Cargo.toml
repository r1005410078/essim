[package]
name = "essim-infrastructure"
version.workspace = true
edition.workspace = true
[features]
default = []
tcp-runtime = ["dep:libmodbus-rs", "dep:mio"]
vendored = ["libmodbus-rs?/vendored"]
[dependencies]
libmodbus-rs = { workspace = true, optional = true }
mio = { version = "=1.2.4", features = ["net", "os-poll"], optional = true }
calamine = "=0.36.1"
csv = "=1.4.0"
essim-core.workspace = true
rust_xlsxwriter = "=0.99.1"
serde = { workspace = true, features = ["derive"] }
serde_json = "=1.0.154"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
serialport = "=4.10.1"
libc = "0.2"
rusqlite = { version = "=0.41.0", features = ["bundled"] }

tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["registry", "std"] }
tracing-log = "=0.2.0"
rolling-file = "=0.2.0"
chrono = "=0.4.45"

[[example]]
name = "m06_baseline"
required-features = ["tcp-runtime"]
